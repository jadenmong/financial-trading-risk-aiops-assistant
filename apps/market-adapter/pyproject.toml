[project]
name = "risk-aiops-market-adapter"
version = "1.0.0"
description = "Optional public-market-data-only adapter; never a trading or position truth source."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.1"
]

[project.optional-dependencies]
akshare = ["akshare==1.18.83"]
test = ["httpx2==2.12.0", "pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
