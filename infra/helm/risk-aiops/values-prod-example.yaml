# Example only. Replace issuer, Secret reference, topology and every release digest through the deployment system.
global:
  secretName: risk-aiops-prod-secrets
  oidcIssuer: https://identity.example.com/realms/risk-aiops
components:
  ai-gateway: { replicas: 3, image: { digest: "REQUIRED_RELEASE_DIGEST" } }
  risk-core: { replicas: 3, image: { digest: "REQUIRED_RELEASE_DIGEST" } }
  ops-console: { replicas: 2, image: { digest: "REQUIRED_RELEASE_DIGEST" } }
autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 12, targetCPUUtilizationPercentage: 60 }
pdb: { enabled: true, minAvailable: 2 }
backup: { enabled: true, schedule: "*/5 * * * *" }
