{{- range $name, $component := .Values.components }}
{{- if or (not $component.image.digest) (eq $component.image.digest "REQUIRED_RELEASE_DIGEST") }}
{{- fail (printf "components.%s.image.digest must be an immutable sha256 release digest" $name) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ $name }}, labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: risk-aiops } }
spec:
  replicas: {{ $component.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: risk-aiops } }
    spec:
      terminationGracePeriodSeconds: 35
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $component.image.repository }}@{{ $component.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: {{ $component.port }} }]
          env:
            - { name: APP_RUNTIME_MODE, value: {{ $.Values.global.runtimeMode | quote }} }
            - { name: OIDC_ISSUER, value: {{ $.Values.global.oidcIssuer | quote }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ $.Values.global.otelEndpoint | quote }} }
            - { name: MARKET_DATA_SOURCE, value: {{ $.Values.global.marketDataSource | quote }} }
            - { name: REQUIRE_SOURCE_MTLS, value: {{ $.Values.global.sourceMtlsRequired | quote }} }
            - { name: SERVER_SSL_CLIENT_AUTH, value: {{ ternary "need" "none" (eq ($.Values.global.sourceMtlsRequired | toString) "true") | quote }} }
          envFrom: [{ secretRef: { name: {{ $.Values.global.secretName }} } }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe: { httpGet: { path: {{ $component.health.live }}, port: http }, failureThreshold: 30, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: {{ $component.health.live }}, port: http }, periodSeconds: 10, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: {{ $component.health.ready }}, port: http }, periodSeconds: 5, failureThreshold: 3 }
          resources: {{ toYaml $component.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ $name }}, labels: { app.kubernetes.io/name: {{ $name }} } }
spec:
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports: [{ name: http, port: {{ $component.port }}, targetPort: http }]
---
{{- end }}
