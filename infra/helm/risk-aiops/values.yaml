global:
  imagePullSecrets: []
  secretName: risk-aiops-secrets
  oidcIssuer: https://identity.example.invalid/realms/risk-aiops
  otelEndpoint: http://otel-collector.observability.svc:4317
components:
  ai-gateway:
    image: { repository: ghcr.io/jadenmong/financial-trading-risk-aiops-assistant/ai-gateway, digest: "" }
    port: 3000
    health: { live: /health/live, ready: /health/ready }
    replicas: 2
    scopes: [market:read, risk:read, reconciliation:read, report:preview]
    resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: 1, memory: 512Mi } }
  risk-core:
    image: { repository: ghcr.io/jadenmong/financial-trading-risk-aiops-assistant/risk-core, digest: "" }
    port: 8080
    health: { live: /actuator/health/liveness, ready: /actuator/health/readiness }
    replicas: 2
    resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: 2, memory: 1Gi } }
  ops-console:
    image: { repository: ghcr.io/jadenmong/financial-trading-risk-aiops-assistant/ops-console, digest: "" }
    port: 8080
    health: { live: /, ready: / }
    replicas: 2
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPUUtilizationPercentage: 70 }
pdb: { enabled: true, minAvailable: 1 }
networkPolicy: { enabled: true }
backup:
  enabled: true
  schedule: "*/5 * * * *"
  postgresImage: "postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636"
  storageClassName: ""
  size: 20Gi
