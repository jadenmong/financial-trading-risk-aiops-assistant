name: release
on: { push: { tags: ['v*.*.*'] } }
permissions: { contents: read, packages: write, id-token: write, attestations: write }
jobs:
  images:
    runs-on: ubuntu-latest
    strategy: { matrix: { component: [ai-gateway, risk-core, ops-console] } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.ref_name }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes ghcr.io/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { image: 'ghcr.io/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}', format: spdx-json, output-file: '${{ matrix.component }}.spdx.json' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: '${{ matrix.component }}-sbom', path: '${{ matrix.component }}.spdx.json' }
