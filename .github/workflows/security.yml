name: security
on:
  pull_request: {}
  push: { branches: [main] }
  schedule: [{ cron: '17 3 * * 1' }]
permissions: { contents: read, security-events: write }
jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: javascript-typescript, build-mode: none }
          - { language: java-kotlin, build-mode: manual }
          - { language: python, build-mode: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: '${{ matrix.language }}'
          build-mode: '${{ matrix.build-mode }}'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: matrix.build-mode == 'manual'
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Build Java for CodeQL
        if: matrix.build-mode == 'manual'
        run: bash mvnw -B -DskipTests package
        working-directory: apps/risk-core
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
  secrets-and-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, scan-ref: '.', format: sarif, output: trivy-results.sarif, severity: 'CRITICAL,HIGH', exit-code: '1' }
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: always()
        with: { sarif_file: trivy-results.sarif }
  dependency-audit:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: '${{ secrets.NVD_API_KEY }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: 21, cache: maven }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: npm ci && npm audit --audit-level=high
      - name: OWASP Dependency Check with NVD feed
        if: env.NVD_API_KEY != ''
        run: >-
          mvn -B -f apps/risk-core/pom.xml
          org.owasp:dependency-check-maven:13.0.0:check
          -DfailBuildOnCVSS=7
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
      - name: Record optional NVD scanner status
        if: env.NVD_API_KEY == ''
        run: echo 'NVD_API_KEY is not configured; Trivy remains the mandatory Maven/POM vulnerability gate.'
      - run: pip install pip-audit && pip-audit -r apps/market-adapter/requirements.lock
