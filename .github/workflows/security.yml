name: security
on:
  pull_request: {}
  push: { branches: [main] }
  schedule: [{ cron: '17 3 * * 1' }]
permissions: { contents: read, security-events: write }
jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy: { matrix: { language: [javascript-typescript, java-kotlin, python] } }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: '${{ matrix.language }}' }
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
  secrets-and-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: aquasecurity/trivy-action@0.33.1
        with: { scan-type: fs, scan-ref: '.', format: sarif, output: trivy-results.sarif, severity: 'CRITICAL,HIGH', exit-code: '1' }
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-results.sarif }
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci && npm audit --audit-level=high
      - run: mvn -B -f apps/risk-core/pom.xml org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
      - run: pip install pip-audit && pip-audit -r apps/market-adapter/requirements.lock
